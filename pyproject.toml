[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = """
  -ra
  --strict-markers
  --alluredir=allure-results
  --clean-alluredir
  --timeout=90
"""
log_cli = true
log_cli_level = "INFO"

markers = [
  "smoke: быстрые базовые проверки",
  "regression: расширенный набор",
  "mobile: тесты на мобильном разрешении",
  "network: тесты с перехватом сети",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "SIM", "C4"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
